[project]
name = "backend"
version = "0.1.0"
description = "Rewarding Adaptive English Learning App Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn==0.27.0",
    "sqlalchemy==2.0.25",
    "pydantic==2.6.0",
    "pydantic-settings==2.1.0",
    "email-validator==2.1.0",
    "python-dotenv==1.0.0",
    "werkzeug==3.0.1",
    "rapidfuzz>=3.6.0",
]

[dependency-groups]
dev = [
    "ty>=0.0.1a1",
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.2",
    "ruff>=0.2.2",
]
